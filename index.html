<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="container">

    <!-- HERO -->
    <section id="hero">
      <h1 id="name"></h1>
      <h2 id="headline"></h2>
      <p id="summary"></p>
    </section>

    <!-- ABOUT -->
    <section id="about-section">
      <h2>About</h2>
      <p id="about"></p>
    </section>

    <!-- SKILLS -->
    <section id="skills-section">
      <h2>Skills</h2>
      <ul id="skills-list"></ul>
    </section>

    <!-- PROJECTS -->
    <section id="projects-section">
      <h2>Projects</h2>
      <div id="projects"></div>
    </section>

    <!-- EXPERIENCE (optional) -->
    <section id="experience-section">
      <h2>Experience</h2>
      <p id="experience"></p>
    </section>

    <!-- EDUCATION -->
    <section id="education-section">
      <h2>Education</h2>
      <p id="education"></p>
    </section>

    <!-- CONTACT -->
    <section id="contact-section">
      <h2>Contact</h2>
      <div id="contact"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
